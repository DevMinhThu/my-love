<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>

<HEAD>
  <TITLE> Hoàng Lan My Love 💖 </TITLE>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    #pinkboard {
      position: relative;
      height: 620px;
      width: 620px;
      animation: animate 1.3s infinite;
    }

    @keyframes animate {
      0% {
        transform: scale(1);
      }

      30% {
        transform: scale(.8);
      }

      60% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      text-align: center;
      color: #ff5ca4;
      font-size: 24px;
      font-style: italic;
      z-index: 5;
    }

    /* ✅ BUTTON GẦN TIM */
    #loveBtn {
      position: absolute;
      top: calc(50% + 340px);
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: #ff5ca4;
      border-radius: 20px;
      color: white;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    .flying-heart {
      position: fixed;
      color: #ff5ca4;
      font-size: 20px;
      z-index: 999;
      pointer-events: none;
    }
  </style>
</HEAD>

<BODY>

  <div class="box">
    <canvas id="pinkboard"></canvas>
  </div>

  <div class="center-text">
    Chúc em buổi sáng thật đặc biệt ạ. 💖 <br />
    Lớppp diuuu emm nhiều 🥰. <br />
    Sớm đồng ý làm: "Lại Tương Vơ Của Anh" nhé 😘
  </div>

  <button id="loveBtn">Click thật nhiều vào đây<br /> Để biết tình cảm anh dành cho em nhiều như nào nhé 💖</button>

  <script>
    var settings = {
      particles: {
        length: 2000,
        duration: 2,
        velocity: 100,
        effect: -1.3,
        size: 13,
      },
    };

    (function () {
      var b = 0;
      var c = ["ms", "moz", "webkit", "o"];
      for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
        window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
      }
    })();

    function Point(x, y) { this.x = x || 0; this.y = y || 0; }
    Point.prototype.clone = function () { return new Point(this.x, this.y); }
    Point.prototype.length = function (length) {
      if (length === undefined) return Math.sqrt(this.x * this.x + this.y * this.y);
      this.normalize(); this.x *= length; this.y *= length; return this;
    };
    Point.prototype.normalize = function () {
      var l = this.length(); this.x /= l; this.y /= l; return this;
    };

    function Particle() { this.position = new Point(); this.velocity = new Point(); this.acceleration = new Point(); this.age = 0; }
    Particle.prototype.initialize = function (x, y, dx, dy) {
      this.position.x = x; this.position.y = y;
      this.velocity.x = dx; this.velocity.y = dy;
      this.acceleration.x = dx * settings.particles.effect;
      this.acceleration.y = dy * settings.particles.effect;
      this.age = 0;
    };
    Particle.prototype.update = function (dt) {
      this.position.x += this.velocity.x * dt;
      this.position.y += this.velocity.y * dt;
      this.velocity.x += this.acceleration.x * dt;
      this.velocity.y += this.acceleration.y * dt;
      this.age += dt;
    };
    Particle.prototype.draw = function (ctx, img) {
      function ease(t) { return (--t) * t * t + 1; }
      var size = img.width * ease(this.age / settings.particles.duration);
      ctx.globalAlpha = 1 - this.age / settings.particles.duration;
      ctx.drawImage(img, this.position.x - size / 2, this.position.y - size / 2, size, size);
    };

    function ParticlePool(length) {
      this.particles = new Array(length);
      for (var i = 0; i < length; i++) this.particles[i] = new Particle();
      this.firstActive = 0;
      this.firstFree = 0;
    }
    ParticlePool.prototype.add = function (x, y, dx, dy) {
      this.particles[this.firstFree].initialize(x, y, dx, dy);
      this.firstFree = (this.firstFree + 1) % this.particles.length;
      if (this.firstActive === this.firstFree)
        this.firstActive = (this.firstActive + 1) % this.particles.length;
    };
    ParticlePool.prototype.update = function (dt) {
      var i;
      if (this.firstActive < this.firstFree) {
        for (i = this.firstActive; i < this.firstFree; i++) this.particles[i].update(dt);
      } else {
        for (i = this.firstActive; i < this.particles.length; i++) this.particles[i].update(dt);
        for (i = 0; i < this.firstFree; i++) this.particles[i].update(dt);
      }
      while (this.particles[this.firstActive].age >= settings.particles.duration && this.firstActive != this.firstFree) {
        this.firstActive = (this.firstActive + 1) % this.particles.length;
      }
    };
    ParticlePool.prototype.draw = function (ctx, img) {
      var i;
      if (this.firstActive < this.firstFree) {
        for (i = this.firstActive; i < this.firstFree; i++) this.particles[i].draw(ctx, img);
      } else {
        for (i = this.firstActive; i < this.particles.length; i++) this.particles[i].draw(ctx, img);
        for (i = 0; i < this.firstFree; i++) this.particles[i].draw(ctx, img);
      }
    };

    (function (canvas) {
      var ctx = canvas.getContext('2d'),
        particles = new ParticlePool(settings.particles.length),
        particleRate = settings.particles.length / settings.particles.duration,
        time;

      function pointOnHeart(t) {
        return new Point(
          160 * Math.pow(Math.sin(t), 3),
          130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
        );
      }

      var image = (function () {
        var c = document.createElement('canvas'), ctx = c.getContext('2d');
        c.width = settings.particles.size;
        c.height = settings.particles.size;
        function to(t) {
          var p = pointOnHeart(t);
          p.x = settings.particles.size / 2 + p.x * settings.particles.size / 350;
          p.y = settings.particles.size / 2 - p.y * settings.particles.size / 350;
          return p;
        }
        ctx.beginPath();
        var t = -Math.PI, p = to(t);
        ctx.moveTo(p.x, p.y);
        while (t < Math.PI) {
          t += 0.01; p = to(t); ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.fillStyle = '#FF5CA4';
        ctx.fill();
        var img = new Image();
        img.src = c.toDataURL();
        return img;
      })();

      function render() {
        requestAnimationFrame(render);
        var newTime = Date.now() / 1000,
          dt = newTime - (time || newTime);
        time = newTime;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var amount = particleRate * dt;
        for (var i = 0; i < amount; i++) {
          var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
          var dir = pos.clone().length(settings.particles.velocity);
          particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
        }

        particles.update(dt);
        particles.draw(ctx, image);
      }

      function onResize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }

      window.onresize = onResize;

      setTimeout(function () {
        onResize();
        render();
      }, 10);

    })(document.getElementById('pinkboard'));

    // 💥 TIM BAY TỪ GIỮA TIM
    document.getElementById("loveBtn").onclick = function () {
      let centerX = window.innerWidth / 2;
      let centerY = window.innerHeight / 2;

      for (let i = 0; i < 150; i++) {
        let h = document.createElement("div");
        h.className = "flying-heart";
        h.innerHTML = "💗";

        let angle = Math.random() * Math.PI * 2;
        let dist = Math.random() * 700 + 100;

        let dx = Math.cos(angle) * dist;
        let dy = Math.sin(angle) * dist;

        h.style.left = centerX + "px";
        h.style.top = centerY + "px";

        document.body.appendChild(h);

        h.animate([
          { transform: "translate(0,0) scale(1)", opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(1.8)`, opacity: 0 }
        ], {
          duration: 2500,
          easing: "ease-out"
        });

        setTimeout(() => h.remove(), 2500);
      }
    };
  </script>

</BODY>

</HTML>
